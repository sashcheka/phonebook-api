name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja oatpp googletest

      - name: Install dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install oatpp oatpp-sqlite gtest --triplet x64-linux
          printf 'CMAKE_TOOLCHAIN_FILE=%s/scripts/buildsystems/vcpkg.cmake\n' \
            "$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
